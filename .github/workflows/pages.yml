name: GitHub Pages

# Pubblica la pagina su https://<utente>.github.io/avinox-mode-planner/
# Serve una volta sola: Settings → Pages → Source: GitHub Actions.
# Versioni delle action allineate al modello ufficiale "static.yml" di GitHub.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: npm test
      - name: Prepara il sito
        run: |
          mkdir -p _site
          cp -r index.html planner.js surface-osm.js manifest.webmanifest sw.js icons _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
